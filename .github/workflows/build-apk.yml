name: Build & Publish Signed Release APKs

on:
  # Manual only: run it from the Actions tab when a batch of changes is ready.
  # Building on every push to main published a release per commit, which meant a
  # full build and a new tag for work that was still in progress.
  #
  # To publish by tagging instead, replace this block with:
  #   on:
  #     push:
  #       tags: [ 'v*' ]
  #     workflow_dispatch:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Bump this on each release. The build falls back to it when the Gradle
  # property is not supplied, so local and CI builds stay in step.
  VERSION_NAME: '0.0.6'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.3.1'

      # versionCode must strictly increase for every artifact that reaches a
      # device, or the package manager refuses to install it over an older build.
      # GITHUB_RUN_NUMBER is monotonic per repository, so offsetting it keeps the
      # value above any locally built APK (the local fallback is 3).
      - name: Compute version
        id: ver
        run: |
          echo "code=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
          echo "name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "Building versionName=${VERSION_NAME} versionCode=$((100 + GITHUB_RUN_NUMBER))"

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.jks

      # Both editions are built and both are lint-checked, so a policy or
      # resource problem fails here rather than at upload time.
      #   standard -> LexiVoice      (no All Files Access, Play-compliant)
      #   pro      -> LexiVoice Pro  (MANAGE_EXTERNAL_STORAGE, sideload)
      - name: Build Signed Release APKs (both editions)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleStandardRelease assembleProRelease \
                 lintVitalStandardRelease lintVitalProRelease \
            -Plexivoice.versionCode=${{ steps.ver.outputs.code }} \
            -Plexivoice.versionName=${{ steps.ver.outputs.name }}

      # Name each artifact from its real edition and version, so the download
      # filename always identifies which app it is and which build it came from.
      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/standard/release/app-standard-release.apk \
             "LexiVoice-v${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}.apk"
          cp app/build/outputs/apk/pro/release/app-pro-release.apk \
             "LexiVoice-Pro-v${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}.apk"
          ls -lh LexiVoice*.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}
          name: LexiVoice v${{ steps.ver.outputs.name }} (${{ steps.ver.outputs.code }})
          body: |
            ## LexiVoice ${{ steps.ver.outputs.name }} (${{ steps.ver.outputs.code }})

            Two editions, same codebase:

            | APK | Edition | Notes |
            | --- | --- | --- |
            | `LexiVoice-v${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}.apk` | LexiVoice | No All Files Access. Play-compliant as-is. |
            | `LexiVoice-Pro-v${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}.apk` | LexiVoice Pro | Adds All Files Access for automatic whole-device EPUB discovery. |

            The two editions have different application IDs, so they install side by
            side — and keep separate libraries and reading progress.
          files: |
            LexiVoice-v${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}.apk
            LexiVoice-Pro-v${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}.apk
          generate_release_notes: true
